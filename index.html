<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Da Gatinha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Pizzaria Da Gatinha</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="#cardapio">Cardápio</a>
                    <a class="nav-link" href="#sobre">Sobre</a>
                    <a class="nav-link" href="#contato">Contato</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Seção Hero / Destaque -->
    <section class="py-5 text-center container">
        <div class="row py-lg-5">
            <div class="col-lg-8 col-md-10 mx-auto">
                <!-- Título ajustado para a Pizzaria -->
                <h1 class="display-4 fw-bold text-body-emphasis mb-3">As Melhores Pizzas da Cidade! 🍕</h1>
                
                <!-- Frase de apoio personalizada -->
                <p class="lead text-body-secondary mb-4">
                    Massa crocante, muito queijo e ingredientes selecionados com todo carinho. Peça já a sua e receba quentinha na sua casa!
                </p>
                
                <!-- Botões de chamada para ação (CTA) -->
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="#cardapio" class="btn btn-primary btn-lg px-4 gap-3">Ver Cardápio</a>
                    <a href="#pedir" class="btn btn-outline-success btn-lg px-4">Fazer Pedido</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
